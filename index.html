<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vaultix Income — Digital Asset Management & Wealth Platform</title>
    <meta name="description" content="Secure digital asset management and automated wealth vaults platform." />
  </head>
  <body class="bg-[#0B0E14] text-white antialiased font-sans">
    <div id="root">
      <div id="initial-vaultix-loader" style="min-height: 100vh; background-color: #0B0E14; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #D4AF37;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(212, 175, 55, 0.2); border-top-color: #D4AF37; border-radius: 50%; animation: vaultix-spin 0.8s linear infinite; margin-bottom: 16px;"></div>
        <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;">Vaultix Income</div>
        <div style="font-size: 11px; color: #94A3B8; margin-top: 6px;">Loading digital asset platform...</div>
        <style>
          @keyframes vaultix-spin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
